<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Furniture and materials library</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14213a;--mut:#5b6679;--line:#d5dae3;--acc:#b9822a;--accI:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1626;--card:#16263d;--ink:#e8edf5;--mut:#9fb0c8;--line:#2a3d5a;--acc:#e0b15a;--accI:#1a1405}}
:root[data-theme="dark"]{--bg:#0d1626;--card:#16263d;--ink:#e8edf5;--mut:#9fb0c8;--line:#2a3d5a;--acc:#e0b15a;--accI:#1a1405}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,360px) 1fr;height:100%}
#v{position:relative;order:2;min-height:0;touch-action:none}#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.p{order:1;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
h2{font-size:14px;margin:16px 0 8px;font-weight:600}h2:first-child{margin-top:0}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 8px}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:var(--accI);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sw{width:30px;height:30px;padding:0;border-radius:50%}input[type=range]{width:100%;accent-color:var(--acc)}input[type=color]{width:36px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.n{color:var(--mut);font-size:12px}table{width:100%;border-collapse:collapse}td{padding:4px 0;border-bottom:1px solid var(--line)}td+td{text-align:right}
.ov{position:absolute;top:10px;right:10px;display:flex;gap:6px}.ov button{background:rgba(15,27,45,.8);color:#fff;border-color:#ffffff33}.ov button.on{background:var(--acc);color:var(--accI)}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:48% 52%}#v{order:1}.p{order:2;border-right:0;border-top:1px solid var(--line)}}
</style></head><body>
<div class="app"><div class="p" id="p"></div><div id="v"><canvas id="c"></canvas><div class="ov"><button id="cut" class="on">Cutaway</button><button id="nt">Night</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=id=>document.getElementById(id),inr=v=>'INR '+Math.round(v).toLocaleString('en-IN'),V3=THREE.Vector3,rnd=Math.random;
const Rm=(n,x,y,w,l,k)=>({n,x,y,w,l,k});
const TPL={'3BHK · 1,200 sq ft':{p:[40,30],r:[Rm('Master bedroom',0,0,13,13,'bed'),Rm('Bath 1',13,0,7,8,'wet'),Rm('Passage',13,8,7,5,'c'),Rm('Bedroom 2',20,0,10,13,'bed'),Rm('Bedroom 3',30,0,10,13,'bed'),Rm('Living room',0,13,16,17,'c'),Rm('Dining',16,13,9,10,'c'),Rm('Kitchen',25,13,15,10,'wet'),Rm('Entry',16,23,9,7,'c'),Rm('Bath 2',25,23,7,7,'wet'),Rm('Utility',32,23,8,7,'c')]},
'2BHK · 900 sq ft':{p:[30,30],r:[Rm('Master bedroom',0,0,12,13,'bed'),Rm('Bath 1',12,0,6,8,'wet'),Rm('Passage',12,8,6,5,'c'),Rm('Bedroom 2',18,0,12,13,'bed'),Rm('Living room',0,13,15,17,'c'),Rm('Dining',15,13,8,9,'c'),Rm('Kitchen',23,13,7,9,'wet'),Rm('Entry',15,22,8,8,'c'),Rm('Bath 2',23,22,7,8,'wet')]}};
const MATS=[['Oak','#b88a55',.6,0],['Walnut','#5b3a24',.55,0],['Marble','#ece9e4',.15,.05],['Grey fabric','#8a8f98',1,0],['Blue fabric','#3f5f8f',1,0],['Leather','#6a4228',.45,0],['Black metal','#232629',.35,.8],['Ceramic','#f5f7f8',.15,.1]];
const FLOORS=[['Wood','#a9794a',.6],['Marble','#e4e1db',.15],['Tile','#aab2ba',.25],['Concrete','#8f918f',1]],FK={bed:0,wet:2,c:1};
const M=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const K={dark:M(0x1c1e22,.4,.5),white:M(0xf1f1ee,.8),black:M(0x0c0c0e,.2,.3),leaf:M(0x3a7a44,1),water:M(0x9fd6e8,.1),steel:M(0xb8bec4,.3,.8)};
const bx=(g,m,w,h,d,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o};
const cy=(g,m,rt,rb,h,x,y,z)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o};
const LIB={
sofa:['Sofa',45000,(g,m)=>{bx(g,m,7,1.2,3,0,.8,0);bx(g,m,7,1.7,.8,0,1.9,-1.1);bx(g,m,.8,1.9,3,-3.6,1.4,0);bx(g,m,.8,1.9,3,3.6,1.4,0);[-1.7,1.7].forEach(x=>bx(g,K.white,3,.5,2.2,x,1.65,.3))}],
bed:['Bed',60000,(g,m)=>{bx(g,m,5.4,.9,6.8,0,.65,0);bx(g,K.white,5,.7,6.4,0,1.35,0);bx(g,m,5.4,2.8,.3,0,2,-3.35);[-1.2,1.2].forEach(x=>bx(g,K.white,1.8,.4,1.2,x,1.85,-2.4))}],
tv:['TV unit',40000,(g,m)=>{bx(g,m,5,1.5,1.4,0,.75,0);bx(g,K.black,4.2,2.4,.2,0,2.7,0);bx(g,K.dark,.4,.4,.5,0,1.7,0)}],
table:['Table',30000,(g,m)=>{bx(g,m,5,.2,3,0,2.5,0);[[-2.3,-1.3],[2.3,-1.3],[-2.3,1.3],[2.3,1.3]].forEach(p=>bx(g,m,.25,2.4,.25,p[0],1.2,p[1]))}],
chair:['Chair',6000,(g,m)=>{bx(g,m,1.6,.2,1.6,0,1.5,0);bx(g,m,1.6,1.9,.2,0,2.5,-.7);[[-.7,-.7],[.7,-.7],[-.7,.7],[.7,.7]].forEach(p=>bx(g,m,.2,1.4,.2,p[0],.7,p[1]))}],
wardrobe:['Wardrobe',35000,(g,m)=>{bx(g,m,4,7,1.8,0,3.5,0);bx(g,K.dark,.06,6.4,.1,0,3.5,.92);[-.3,.3].forEach(x=>bx(g,K.steel,.1,1,.1,x,3.5,1))}],
cabinet:['Kitchen cabinet',70000,(g,m)=>{bx(g,m,6,2.8,2.2,0,1.4,0);bx(g,K.white,6.1,.2,2.3,0,2.9,0);bx(g,K.steel,1.6,.1,1.2,-1.4,3.02,0);cy(g,K.steel,.08,.08,.8,-1.4,3.4,-.7)}],
toilet:['Toilet',12000,(g,m)=>{bx(g,m,1.2,1.3,2,0,.65,.3);bx(g,m,1.3,1.7,.6,0,1.4,-.8);bx(g,K.white,1.3,.15,1.6,0,1.4,.4)}],
bath:['Bathtub',40000,(g,m)=>{bx(g,m,5.5,1.8,2.6,0,.9,0);bx(g,K.water,5,.05,2.1,0,1.82,0);cy(g,K.steel,.1,.1,1.2,2.5,2.2,0)}],
plant:['Plant',1500,(g,m)=>{cy(g,m,.7,.5,1.2,0,.6,0);[[0,2.2,0,1],[.5,3.1,.2,.8],[-.5,2.9,-.2,.8]].forEach(a=>{const s=new THREE.Mesh(new THREE.IcosahedronGeometry(a[3],1),K.leaf);s.position.set(a[0],a[1],a[2]);s.castShadow=true;g.add(s)})}],
lamp:['Floor lamp',5000,(g,m,u)=>{cy(g,K.dark,.6,.6,.15,0,.08,0);cy(g,K.dark,.07,.07,4.8,0,2.5,0);u.glow=M(0xfff0c8,.9);u.glow.emissive.set(0xffd890);cy(g,u.glow,.5,.8,1,0,5.3,0);u.pl=new THREE.PointLight(0xffd890,0,22,1.5);u.pl.position.set(0,5.5,0);g.add(u.pl)}],
light:['Ceiling light',3500,(g,m,u)=>{u.glow=M(0xfff0c8,.9);u.glow.emissive.set(0xffd890);cy(g,K.dark,.05,.05,1.6,0,8.2,0);const s=new THREE.Mesh(new THREE.SphereGeometry(.7,16,12),u.glow);s.position.y=7.3;g.add(s);u.pl=new THREE.PointLight(0xffd890,0,26,1.4);u.pl.position.set(0,7,0);g.add(u.pl);u.air=1}]};
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,1,500);cam.position.set(0,42,40);
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI/2.1;ctl.minDistance=8;ctl.maxDistance=120;
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,50,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-35;sc.right=35;sc.top=35;sc.bottom=-35;sc.far=200;S.add(sun);const hemi=new THREE.HemisphereLight(0xdfeeff,0x777060,.7);S.add(hemi);
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M(0x4a7c3a,1));gnd.rotation.x=-Math.PI/2;gnd.position.y=-.05;gnd.receiveShadow=true;S.add(gnd);
const wallM=M(0xf1efe9,.9);let tpl=Object.keys(TPL)[0],shell=null,walls=[],floors=[],items=[],sel=null,room=null,night=false,cut=true,wallH=3.4,P=[40,30];
const box=new THREE.BoxHelper(new THREE.Object3D(),0xe0b15a);box.visible=false;S.add(box);
const fl={};
function buildShell(){if(shell)S.remove(shell);shell=new THREE.Group();S.add(shell);walls=[];floors=[];P=TPL[tpl].p;
TPL[tpl].r.forEach((r,i)=>{const cx=r.x+r.w/2-P[0]/2,cz=r.y+r.l/2-P[1]/2,f=fl[tpl+r.n]||FLOORS[FK[r.k]],m=M(f[1],f[2]);m.userData={};
const fm=bx(shell,m,r.w-.02,.2,r.l-.02,cx,.0,cz);fm.userData.room=r.n;fm.userData.fl=tpl+r.n;fm.castShadow=false;floors.push(fm);
const t=.3+i*.002;[[r.w+t,t,cx,cz-r.l/2],[r.w+t,t,cx,cz+r.l/2],[t,r.l+t,cx-r.w/2,cz],[t,r.l+t,cx+r.w/2,cz]].forEach(a=>{const w=bx(shell,wallM,a[0],1,a[1],a[2],.5,a[3]);walls.push(w)})});setWalls()}
function setWalls(){wallH=cut?3.4:9;walls.forEach(w=>{w.scale.y=wallH;w.position.y=wallH/2})}
function roomAt(x,z){const q=TPL[tpl].r.find(r=>x>=r.x-P[0]/2&&x<=r.x+r.w-P[0]/2&&z>=r.y-P[1]/2&&z<=r.y+r.l-P[1]/2);return q?q.n:'Outside'}
function addItem(t,at,props){const g=new THREE.Group(),u=g.userData;u.type=t;const mm=M(0xb88a55,.6);u.mm=mm;LIB[t][2](g,mm,u);
const Rr=room&&TPL[tpl].r.find(r=>r.n===room)||TPL[tpl].r[5];const s=at||[Rr.x+Rr.w/2-P[0]/2+Math.round((rnd()-.5)*4)/2,Rr.y+Rr.l/2-P[1]/2+Math.round((rnd()-.5)*4)/2];
g.position.set(s[0],.1,s[1]);if(u.air)g.position.y=0;
if(props){g.rotation.y=props.r||0;g.scale.setScalar(props.s||1);mm.color.set(props.c);mm.roughness=props.ro;mm.metalness=props.me}
S.add(g);items.push(g);lite();return g}
function lite(){items.forEach(g=>{const u=g.userData;if(u.pl)u.pl.intensity=night?1.5:0;if(u.glow)u.glow.emissiveIntensity=night?2:.15});
sun.intensity=night?.15:2;hemi.intensity=night?.12:.7;S.background=new THREE.Color(night?0x070b18:0x9ec3e6)}
const rc=new THREE.Raycaster(),mp=new THREE.Vector2(),pl=new THREE.Plane(new V3(0,1,0),-.1),pt=new V3();let drag=null;
const ndc=e=>{const b=cv.getBoundingClientRect();mp.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);rc.setFromCamera(mp,cam)};
cv.addEventListener('pointerdown',e=>{ndc(e);const h=rc.intersectObjects(items,true)[0];
if(h){let o=h.object;while(!o.userData.type)o=o.parent;sel=o;rc.ray.intersectPlane(pl,pt);drag={o,dx:o.position.x-pt.x,dz:o.position.z-pt.z};ctl.enabled=false;cv.setPointerCapture(e.pointerId)}
else{sel=null;const f=rc.intersectObjects(floors)[0];if(f)room=f.object.userData.room}ui()});
cv.addEventListener('pointermove',e=>{if(!drag)return;ndc(e);if(!rc.ray.intersectPlane(pl,pt))return;const o=drag.o;o.position.x=Math.max(-P[0]/2+1,Math.min(P[0]/2-1,Math.round((pt.x+drag.dx)*2)/2));o.position.z=Math.max(-P[1]/2+1,Math.min(P[1]/2-1,Math.round((pt.z+drag.dz)*2)/2))});
const end=()=>{if(drag){drag=null;ctl.enabled=true;ui();save()}};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{if(!sel)return;if(e.key==='r'||e.key==='R')rot(Math.PI/2);if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del()}});
function rot(a){if(sel){sel.rotation.y+=a;save()}}
function del(){if(!sel)return;S.remove(sel);items=items.filter(i=>i!==sel);sel=null;lite();ui();save()}
function dup(){if(!sel)return;const u=sel.userData,n=addItem(u.type,[sel.position.x+1.5,sel.position.z+1.5],{r:sel.rotation.y,s:sel.scale.x,c:'#'+u.mm.color.getHexString(),ro:u.mm.roughness,me:u.mm.metalness});sel=n;ui();save()}
function applyMat(i){const a=MATS[i],m=sel.userData.mm;m.color.set(a[1]);m.roughness=a[2];m.metalness=a[3];save()}
function floorMat(i){const m=floors.find(f=>f.userData.room===room);if(!m)return;const f=FLOORS[i];m.material.color.set(f[1]);m.material.roughness=f[2];fl[m.userData.fl]=f;save()}
function ui(){let h=`<h2>Floor plan</h2><select id="tp" aria-label="Floor plan">${Object.keys(TPL).map(k=>`<option ${k===tpl?'selected':''}>${k}</option>`).join('')}</select><div class="n">Changing the plan clears placed furniture.</div>
<h2>Furniture library</h2><div class="g">${Object.keys(LIB).map(k=>`<button onclick="addItem('${k}');ui();save()">${LIB[k][0]}</button>`).join('')}</div><div class="n">Added to ${room||'Living room'}. Drag objects to move them.</div>`;
if(sel){const u=sel.userData;h+=`<h2>${LIB[u.type][0]} · ${roomAt(sel.position.x,sel.position.z)}</h2><div class="r"><button onclick="rot(-Math.PI/2)">Rotate left</button><button onclick="rot(Math.PI/2)">Rotate right</button><button onclick="dup()">Duplicate</button><button onclick="del()">Delete</button></div>
<div class="n" style="margin-top:8px">Size</div><input type="range" min=".6" max="1.6" step=".05" value="${sel.scale.x}" oninput="sel.scale.setScalar(+this.value)" onchange="save()" aria-label="Size"><div class="n">Material</div><div class="r">${MATS.map((a,i)=>`<button class="sw" title="${a[0]}" aria-label="${a[0]}" style="background:${a[1]}" onclick="applyMat(${i})"></button>`).join('')}<input type="color" value="#${u.mm.color.getHexString()}" oninput="sel.userData.mm.color.set(this.value)" onchange="save()" aria-label="Custom colour"></div>`}
else h+=`<h2>${room?room+' floor':'Room floor'}</h2><div class="r">${room?FLOORS.map((f,i)=>`<button onclick="floorMat(${i})">${f[0]}</button>`).join(''):'<span class="n">Click a room floor to choose its material.</span>'}</div>`;
h+=`<h2>Wall paint</h2><div class="r">${['#f1efe9','#d9c7a3','#b9c6d3','#e6d3d3','#9aa5b1'].map(c=>`<button class="sw" style="background:${c}" aria-label="Paint ${c}" onclick="wallM.color.set('${c}')"></button>`).join('')}</div>`;
const by={};items.forEach(g=>{const k=roomAt(g.position.x,g.position.z)+'|'+LIB[g.userData.type][0];by[k]=(by[k]||0)+1});const tot=items.reduce((s,g)=>s+LIB[g.userData.type][1],0);
h+=`<h2>Placed items (${items.length})</h2>${items.length?`<table>${Object.entries(by).map(([k,n])=>`<tr><td>${k.split('|')[0]}: ${k.split('|')[1]}</td><td>${n}</td></tr>`).join('')}<tr><td><b>Furniture estimate</b></td><td><b>${inr(tot)}</b></td></tr></table><div class="n">Planning estimate only, not a quotation.</div>`:'<div class="n">Nothing placed yet.</div>'}`;
$('p').innerHTML=h;$('tp').onchange=e=>{tpl=e.target.value;items.forEach(g=>S.remove(g));items=[];sel=null;room=null;buildShell();ui();save()}}
function save(){try{localStorage.setItem('dh3d-furn',JSON.stringify({tpl,fl,wall:'#'+wallM.color.getHexString(),items:items.map(g=>({t:g.userData.type,x:g.position.x,z:g.position.z,r:g.rotation.y,s:g.scale.x,c:'#'+g.userData.mm.color.getHexString(),ro:g.userData.mm.roughness,me:g.userData.mm.metalness}))}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('dh3d-furn')||'null');if(d&&TPL[d.tpl]){tpl=d.tpl;Object.assign(fl,d.fl||{});if(d.wall)wallM.color.set(d.wall);buildShell();(d.items||[]).forEach(i=>LIB[i.t]&&addItem(i.t,[i.x,i.z],i))}else buildShell()}catch(e){buildShell()}
$('cut').onclick=e=>{cut=!cut;e.target.classList.toggle('on',cut);setWalls()};$('nt').onclick=e=>{night=!night;e.target.classList.toggle('on',night);lite()};
lite();ui();
function resize(){const v=$('v');R.setSize(v.clientWidth,v.clientHeight,false);cam.aspect=v.clientWidth/v.clientHeight;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe($('v'));
(function tick(){if(sel){box.visible=true;box.setFromObject(sel)}else box.visible=false;ctl.update();R.render(S,cam);requestAnimationFrame(tick)})();
</script></body></html>
